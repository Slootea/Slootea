services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-appointment_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-appointment_pass}
      POSTGRES_DB: ${POSTGRES_DB:-appointment_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-appointment_user} -d ${POSTGRES_DB:-appointment_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - slootea_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER:-appointment_user}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-appointment_pass}
      DATABASE_NAME: ${POSTGRES_DB:-appointment_db}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      META_APP_ID: ${META_APP_ID}
      META_APP_SECRET: ${META_APP_SECRET}
      META_OAUTH_REDIRECT_URI: ${META_OAUTH_REDIRECT_URI}
      FRONTEND_URL: ${FRONTEND_URL}
      WHATSAPP_TOKEN_ENCRYPTION_KEY: ${WHATSAPP_TOKEN_ENCRYPTION_KEY}
      VERIMOR_USERNAME: ${VERIMOR_USERNAME}
      VERIMOR_PASSWORD: ${VERIMOR_PASSWORD}
      VERIMOR_SOURCE_ADDR: ${VERIMOR_SOURCE_ADDR:-}
      TYPEORM_SYNCHRONIZE: ${TYPEORM_SYNCHRONIZE:-false}
      NODE_ENV: production
    expose:
      - "3001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - slootea_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://www.slootea.com}
    environment:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
    expose:
      - "3000"
    labels:
      - "traefik.enable=true"
      # Router for www -> non-www redirect
      - "traefik.http.routers.frontend-www.rule=Host(`www.slootea.com`)"
      - "traefik.http.routers.frontend-www.entrypoints=web"
      - "traefik.http.routers.frontend-www.middlewares=redirect-to-non-www"
      - "traefik.http.middlewares.redirect-to-non-www.redirectregex.regex=^https?://www\\.(.*)"
      - "traefik.http.middlewares.redirect-to-non-www.redirectregex.replacement=http://$$1"
      # Main router for non-www
      - "traefik.http.routers.frontend.rule=Host(`slootea.com`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000" 

    depends_on:
      - backend
    networks:
      - slootea_network

volumes:
  postgres_data:

networks:
  slootea_network:
    driver: bridge
