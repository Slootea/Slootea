services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-appointment_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-appointment_pass}
      POSTGRES_DB: ${POSTGRES_DB:-appointment_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-appointment_user} -d ${POSTGRES_DB:-appointment_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - slootea_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER:-appointment_user}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-appointment_pass}
      DATABASE_NAME: ${POSTGRES_DB:-appointment_db}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      META_APP_ID: ${META_APP_ID}
      META_APP_SECRET: ${META_APP_SECRET}
      META_OAUTH_REDIRECT_URI: ${META_OAUTH_REDIRECT_URI}
      FRONTEND_URL: ${FRONTEND_URL}
      WHATSAPP_TOKEN_ENCRYPTION_KEY: ${WHATSAPP_TOKEN_ENCRYPTION_KEY}
      VERIMOR_USERNAME: ${VERIMOR_USERNAME}
      VERIMOR_PASSWORD: ${VERIMOR_PASSWORD}
      VERIMOR_SOURCE_ADDR: ${VERIMOR_SOURCE_ADDR:-}
      TYPEORM_SYNCHRONIZE: ${TYPEORM_SYNCHRONIZE:-false}
      NODE_ENV: production
    expose:
      - "3001"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - slootea_network
      - coolify

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://www.slootea.com}
    environment:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
    expose:
      - "3000"
    labels:
      - "traefik.enable=true"
      # Just reference the middleware from your dynamic file
      - "traefik.http.routers.http-0.middlewares=global-www-to-non-www@file"
      - "traefik.http.routers.https-0.middlewares=global-www-to-non-www@file"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - slootea_network
      - coolify

volumes:
  postgres_data:

networks:
  slootea_network:
    driver: bridge
  coolify:
    external: true
